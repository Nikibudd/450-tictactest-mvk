plugins {
	id 'java'
	id 'application'
	id 'jacoco'
	id 'info.solidsoft.pitest' version '1.19.0'
}

dependencies {
	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
	testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0'
	testImplementation platform('io.cucumber:cucumber-bom:8.0.4')
	testImplementation 'io.cucumber:cucumber-java'
	testImplementation 'io.cucumber:cucumber-junit-platform-engine'
	testImplementation 'org.junit.platform:junit-platform-suite'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'tools.jackson.core:jackson-databind:3.2.4' // JSON library Cucumber needs to write its reports
}

repositories {
	mavenCentral()
}

java {
	// bytecode for Java 21 (LTS), so the released jar also runs on older JDKs than the one building it
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
}

application {
	mainClass = 'ch.bbw.m450.tictactoe.TicTacToeMain'
}

jar {
	// makes the jar runnable with `java -jar`
	manifest {
		attributes 'Main-Class': application.mainClass.get()
	}
}

test {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn test
	violationRules {
		rule {
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.90
			}
		}
	}
}

check {
	dependsOn jacocoTestCoverageVerification
}

pitest {
	pitestVersion = '1.30.1'
	junit5PluginVersion = '1.2.3'
	targetClasses = ['ch.bbw.m450.tictactoe.*']
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
	mutationThreshold = 90
}

run {
	standardInput = System.in
}
