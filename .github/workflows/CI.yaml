on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./gradlew build -x test
  test:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: ./gradlew test
