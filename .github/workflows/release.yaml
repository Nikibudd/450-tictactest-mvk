# Ein Tag v* auf main (z. B. v1.2.0) erzeugt einen GitHub-Release mit dem Jar und dem Frontend-Archiv.
on:
  push:
    tags:
      - 'v*'

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.detect.outputs.previous }}
      backend: ${{ steps.detect.outputs.backend }}
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ganze History und alle Tags, um mit dem vorherigen Release-Tag zu vergleichen
          fetch-depth: 0

      - name: Tag must be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Release-Tags nur auf Commits von main setzen"; exit 1; }

      - name: Detect changes since previous release
        id: detect
        run: scripts/detect-changes.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    uses: ./.github/workflows/build-test-coverage.yaml
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: read

  release:
    needs: [changes, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: tictactoe-jar
          path: dist

      - name: Package frontend (version.json from the tag)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "{\"version\": \"$VERSION\"}" > frontend/version.json
          (cd frontend && zip -r "../dist/tictactest-frontend-$VERSION.zip" .)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS: ${{ needs.changes.outputs.previous }}
          BACKEND: ${{ needs.changes.outputs.backend }}
          FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          # a re-run of the same tag must not fail on the already existing release
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            -R "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "TicTacTest $VERSION" \
            --generate-notes \
            --notes "Geändert seit ${PREVIOUS:-dem ersten Release}: Backend $BACKEND, Frontend $FRONTEND. Lokal starten: \`scripts/run-local.sh $GITHUB_REF_NAME\`"
