on:
  push:
    paths:
      - '.devcontainer/**'
  pull_request:
    paths:
      - '.devcontainer/**'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ steps.meta.outputs.sha_tag }}

  release:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: devcontainer-release
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote reviewed image to latest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:latest \
            ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ needs.build-and-push.outputs.sha_tag }}

  open-release-pr:
    needs: [build-and-push, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Record released version
        run: |
          {
            echo "image: ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ needs.build-and-push.outputs.sha_tag }}"
            echo "released_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${{ github.sha }}"
          } > .devcontainer/RELEASED_VERSION

      - name: Open documentation PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs: devcontainer release ${{ needs.build-and-push.outputs.sha_tag }}"
          title: "Devcontainer release ${{ needs.build-and-push.outputs.sha_tag }}"
          body: |
            Automatisch erstellt nach erfolgreicher Freigabe.

            `latest` zeigt jetzt auf `ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ needs.build-and-push.outputs.sha_tag }}`
            (Commit ${{ github.sha }}).

            Dieser PR aktualisiert nur die Audit-Datei `.devcontainer/RELEASED_VERSION` und dient der Nachvollziehbarkeit.
          branch: devcontainer-release/${{ needs.build-and-push.outputs.sha_tag }}
          add-paths: .devcontainer/RELEASED_VERSION
