on:
  push:
    paths:
      - '.devcontainer/Dockerfile'
  pull_request:
    paths:
      - '.devcontainer/Dockerfile'

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: meta
        run: echo "sha_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ steps.meta.outputs.sha_tag }}

  open-release-pr:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump image tag references
        run: |
          sed -i -E "s#(ghcr\.io/nikibudd/450-tictactest-mvk-devcontainer):[A-Za-z0-9_.-]+#\1:${{ needs.build-and-push.outputs.sha_tag }}#g" \
            .github/workflows/build-test-coverage.yaml \
            .devcontainer/devcontainer.json

      - name: Open release PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "release: devcontainer image ${{ needs.build-and-push.outputs.sha_tag }}"
          title: "Release DevContainer image ${{ needs.build-and-push.outputs.sha_tag }}"
          body: |
            Neues DevContainer-Image wurde gebaut und nach GHCR gepusht:
            `ghcr.io/nikibudd/450-tictactest-mvk-devcontainer:${{ needs.build-and-push.outputs.sha_tag }}`
            (Commit ${{ github.sha }}).

            **Mergen dieses PRs ist die Freigabe** — danach nutzen CI und lokale DevContainer
            automatisch dieses Image.
          branch: devcontainer-release/${{ needs.build-and-push.outputs.sha_tag }}
