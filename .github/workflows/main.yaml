on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'

jobs:
  ci:
    uses: ./.github/workflows/build-test-coverage.yaml
    permissions:
      contents: read
      packages: read

  update-coverage-history:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary

      - name: Load coverage summary
        run: cat coverage-summary/summary.env >> "$GITHUB_ENV"

      - name: Append entry to coverage-history branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin coverage-history
          git worktree add ../coverage-history-wt origin/coverage-history

          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=${GITHUB_SHA:0:12}
          echo "${DATE},${SHA},${LINE_COVERED},${LINE_MISSED},${LINE_COVERAGE_PCT},${BRANCH_COVERED},${BRANCH_MISSED},${BRANCH_COVERAGE_PCT}" >> ../coverage-history-wt/history.csv

          cd ../coverage-history-wt
          git checkout -B coverage-history
          git add history.csv
          git commit -m "coverage: main @ ${SHA} (${LINE_COVERAGE_PCT}% line)"
          git push origin coverage-history

  release:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: tictactoe-jar
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_SHA::12}
          TAG="release-${VERSION}"

          # a re-run of the same commit must not fail on the already existing release
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG" dist/*.jar \
            -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TicTacToe ${VERSION}" \
            --generate-notes \
            --notes "Run with Java 21 or newer: \`java -jar 450-tictactest-mvk-${VERSION}.jar\`"
