# nginx vor der Web-Konsole: liefert die laufende Version aus und leitet alles andere an ttyd weiter.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;

    # wird beim Deployment neben das Jar geschrieben; das Frontend fragt sie von einer anderen Origin ab
    location = /version.txt {
        root /opt/tictactest/current;
        default_type text/plain;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control no-store always;
    }

    # ttyd hört nur auf localhost; Terminal und WebSocket laufen über diesen Proxy
    location / {
        proxy_pass http://127.0.0.1:7681;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
